# Sert les fichiers statiques Angular et reverse-proxy /api vers le
# back-end. Le nom d'hôte "backend" est résolu par Docker Compose (nom du
# service) — jamais une adresse IP codée en dur.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API : transmise telle quelle au back-end Spring Boot. C'est LUI qui
    # authentifie, autorise et journalise — Nginx ne fait que transporter.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Documentation OpenAPI / Swagger (utile en recette, pas exposé au public
    # au-delà de ce que le tunnel expose — à retirer si non souhaité).
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }
    location /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    # `index.html` ne doit jamais être mis en cache : c'est lui qui
    # référence les empreintes des fichiers versionnés ci-dessous.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fichiers versionnés (empreinte dans le nom) : cache long sans risque.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routage Angular côté client : toute route inconnue de Nginx retombe
    # sur index.html, qui laisse le routeur Angular décider (y compris
    # /forbidden, /not-found — gérés côté application, pas ici).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité de base sur les réponses servies par Nginx lui-même
    # (le back-end applique déjà les siens sur /api — docs/02 §32.3).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
