@if (visible()) {
  <!-- Voile purement visuel : la fermeture passe par les boutons ou Échap. -->
  <div class="session-warning__scrim" aria-hidden="true"></div>
  <div
    class="session-warning"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="session-warning-title"
    aria-describedby="session-warning-desc"
    (keydown)="onKeydown($event)"
  >
    <h2 id="session-warning-title" class="session-warning__title">
      <mat-icon aria-hidden="true">timer</mat-icon>
      Votre session va bientôt expirer
    </h2>
    <p id="session-warning-desc" class="session-warning__desc">
      Par sécurité, vous serez déconnecté faute d'activité. Il reste
      <strong aria-live="polite">{{ secondsRemaining() }} seconde(s)</strong>.
      Vos données non enregistrées seraient perdues.
    </p>
    <div class="session-warning__actions">
      <button
        #continueButton
        type="button"
        mat-flat-button
        color="primary"
        [disabled]="renewing()"
        (click)="onContinue()"
      >
        {{ renewing() ? 'Renouvellement…' : 'Continuer la session' }}
      </button>
      <button type="button" mat-button [disabled]="renewing()" (click)="onLogout()">
        Se déconnecter
      </button>
    </div>
  </div>
}
