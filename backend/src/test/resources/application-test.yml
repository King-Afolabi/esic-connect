# Profil de test : pointe pour l'instant vers les mêmes conteneurs locaux
# (compose.yaml) que le profil "local", faute de Testcontainers à ce stade
# (non demandé pour ce socle). À remplacer par une base de test isolée
# lorsque la suite de tests d'intégration sera construite.
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
