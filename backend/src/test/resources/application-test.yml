# Profil de test : pointe vers les mêmes conteneurs locaux (compose.yaml)
# que le profil "local". La migration vers Testcontainers est
# explicitement DIFFÉRÉE — motivation, contournement local et travail à
# planifier dans docs/reports/TEST_ISOLATION_DECISION.md (FINAL-021).
# En CI, l'isolation existe de fait : base éphémère `esic_connect_ci`
# d'un service GitHub Actions jeté à chaque run.
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      # Chaque classe @SpringBootTest déclare sa propre @TestConfiguration
      # imbriquée : Spring met donc en cache un contexte (et un pool
      # HikariCP) distinct par classe. Avec le pool par défaut (10) et une
      # vingtaine de contextes cumulés, MySQL 8 (`max_connections` = 151
      # par défaut, y compris en CI) est saturé (« Too many connections »).
      # Un pool réduit garde assez de connexions pour les transactions
      # imbriquées (REQUIRES_NEW de l'audit) et les cas concurrents tout
      # en restant très en dessous de la limite serveur.
      #
      # `minimum-idle: 0` + `idle-timeout` court : un contexte mis en cache
      # dont les tests sont terminés relâche ses connexions au lieu de les
      # accumuler pendant toute la durée de la suite — c'est cette
      # accumulation (et non le pic d'un seul contexte) qui approchait la
      # limite serveur au fur et à mesure que la suite grandit.
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 15000
      keepalive-time: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  mail:
    # Un JavaMailSender est requis par le contexte ; les tests remplacent
    # l'InvitationMailer par un double enregistreur et n'ouvrent jamais de
    # connexion SMTP réelle.
    host: localhost
    port: 1025

management:
  health:
    # L'indicateur santé mail est désactivé en test (pas de SMTP réel).
    mail:
      enabled: false

app:
  security:
    jwt:
      # Secret exclusif aux tests automatisés (≥ 32 octets) — jamais dans
      # .env, jamais une valeur de production.
      secret: test-only-jwt-signing-secret-for-esic-connect-automated-tests-do-not-use-in-prod
    invitation:
      # TTL court pour les tests ; un cas dédié vérifie le rejet d'un TTL
      # non positif via un contexte séparé.
      token-ttl: PT1H
  activation:
    base-url: http://localhost:4200/activation
  mail:
    from: no-reply@esic-connect.test
