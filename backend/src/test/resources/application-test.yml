# Profil de test : pointe vers les mêmes conteneurs locaux (compose.yaml)
# que le profil "local". La migration vers Testcontainers est
# explicitement DIFFÉRÉE — motivation, contournement local et travail à
# planifier dans docs/09-strategie-tests.md.
# En CI, l'isolation existe de fait : base éphémère `esic_connect_ci`
# d'un service GitHub Actions jeté à chaque run.
#
# ISOLATION TEST / DÉMONSTRATION — la suite lit `MYSQL_TEST_DATABASE`, et
# NON `MYSQL_DATABASE`. Les deux variables étaient confondues : lancer le
# back-end de démonstration avec `MYSQL_DATABASE=esic_connect_demo`
# faisait alors écrire la suite de tests DANS la base de démonstration
# (les tests créent des milliers de comptes et tronquent des tables).
# Défaut local `esic_test` ; la CI impose explicitement
# `MYSQL_TEST_DATABASE: esic_connect_ci` (voir .github/workflows/backend-ci.yml).
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_TEST_DATABASE:esic_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      # Chaque classe @SpringBootTest déclare sa propre @TestConfiguration
      # imbriquée : Spring met donc en cache un contexte (et un pool
      # HikariCP) distinct par classe. Avec le pool par défaut (10) et une
      # vingtaine de contextes cumulés, MySQL 8 (`max_connections` = 151
      # par défaut, y compris en CI) est saturé (« Too many connections »).
      # Un pool réduit garde assez de connexions pour les transactions
      # imbriquées (REQUIRES_NEW de l'audit) et les cas concurrents tout
      # en restant très en dessous de la limite serveur.
      #
      # `minimum-idle: 0` + `idle-timeout` court : un contexte mis en cache
      # dont les tests sont terminés relâche ses connexions au lieu de les
      # accumuler pendant toute la durée de la suite — c'est cette
      # accumulation (et non le pic d'un seul contexte) qui approchait la
      # limite serveur au fur et à mesure que la suite grandit.
      #
      # PORTÉ DE 4 À 6 AU SPRINT 10. L'outbox transactionnelle draine la
      # file dans le `afterCompletion` de la transaction métier : à cet
      # instant, la connexion de cette transaction n'est PAS encore
      # relâchée (Spring ne la rend qu'après avoir déclenché les
      # synchronisations), tandis que le diffuseur en ouvre une seconde.
      # Un même fil de requête détient donc désormais deux connexions au
      # lieu d'une. Avec quatre, une classe exerçant plusieurs requêtes
      # simultanées pouvait épuiser le pool, faire échouer une écriture, et
      # produire un échec intermittent sans rapport apparent avec ce
      # qu'elle vérifiait.
      maximum-pool-size: 6
      minimum-idle: 0
      idle-timeout: 15000
      keepalive-time: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  mail:
    # Un JavaMailSender est requis par le contexte ; les tests remplacent
    # l'InvitationMailer par un double enregistreur et n'ouvrent jamais de
    # connexion SMTP réelle.
    host: localhost
    port: 1025

management:
  health:
    # L'indicateur santé mail est désactivé en test (pas de SMTP réel).
    mail:
      enabled: false

app:
  security:
    jwt:
      # Secret exclusif aux tests automatisés (≥ 32 octets) — jamais dans
      # .env, jamais une valeur de production.
      secret: test-only-jwt-signing-secret-for-esic-connect-automated-tests-do-not-use-in-prod
    invitation:
      # TTL court pour les tests ; un cas dédié vérifie le rejet d'un TTL
      # non positif via un contexte séparé.
      token-ttl: PT1H
    cors:
      # Origines de test pour HttpSecurityHeadersIntegrationTests /
      # la vérification CORS. `http://evil.example` n'est PAS listé.
      allowed-origins: http://localhost:4200,https://app.esic.test
    login:
      # LIMITATION DE DÉBIT EN TEST — seuils volontairement très hauts.
      #
      # La suite complète effectue plusieurs centaines de connexions
      # depuis la même origine (127.0.0.1) en quelques minutes : avec les
      # seuils de production (60 par quart d'heure et par origine), la
      # moitié des classes de test échoueraient en 429 pour une raison
      # sans rapport avec ce qu'elles vérifient.
      #
      # Le mécanisme lui-même reste testé : RedisRateLimiterTests exerce
      # le compteur directement, et AuthRateLimitIntegrationTests redéfinit
      # des seuils bas via @SpringBootTest(properties = ...) pour vérifier
      # le 429 de bout en bout sur la route de connexion.
      identity-limit: 5000
      origin-limit: 500000
      window: PT15M
    password-reset:
      # Même raison : les tests de réinitialisation enchaînent les
      # demandes sur des adresses distinctes, mais la borne par jeton est
      # partagée quand un test rejoue volontairement un jeton.
      request-limit: 500
      consume-limit: 500
  attendance:
    # Pièces jointes de justificatifs (bloc G1-E) : répertoire jetable
    # sous le tmp de la JVM — jamais /data/uploads (non inscriptible en
    # test). Les tests dédiés utilisent en plus @TempDir.
    justification-storage-path: ${java.io.tmpdir}/esic-connect-justification-attachments-test
  activation:
    base-url: http://localhost:4200/activation
  password-reset:
    base-url: http://localhost:4200/reinitialisation
  mail:
    from: no-reply@esic-connect.test
