# Profil local : services d'infrastructure fournis par compose.yaml.
# Toutes les valeurs sensibles proviennent des variables d'environnement du
# fichier .env (jamais de secret en dur ici).
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

management:
  health:
    # Mailpit n'est pas une dépendance critique en développement : son
    # indisponibilité ne doit pas faire passer /actuator/health en DOWN.
    mail:
      enabled: false
