spring:
  application:
    name: esic-connect-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      # Enveloppe servlet commune aux téléversements : import CSV des
      # apprenants / du planning (2 MiB, re-vérifiés côté service →
      # `IMP_FILE_TOO_LARGE` / `PLAN_UNSUPPORTED_FILE`) ET pièces jointes
      # de justificatifs (bloc G1-E : 5 Mo, RG-071, re-vérifiés côté
      # service → `ATT_ATTACHMENT_TOO_LARGE`). La borne servlet est donc
      # 6 Mo (5 Mo + marge d'enveloppe multipart) ; chaque module reste
      # maître de sa propre limite métier.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:7MB}
      # Résolution paresseuse : le parsing du multipart (et donc un
      # éventuel dépassement de taille) a lieu pendant l'exécution du
      # contrôleur, ce qui permet à l'advice d'erreur du module
      # `studentimport` de retraduire l'exception en `IMP_FILE_TOO_LARGE`
      # (sinon elle est levée par le DispatcherServlet avant la résolution
      # du contrôleur et retombe en 500 générique).
      resolve-lazily: true
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway est seul responsable du schéma : Hibernate ne doit jamais le générer.
      ddl-auto: validate
  mail:
    # Serveur SMTP local (Mailpit) par défaut ; surchargé par MAIL_HOST /
    # MAIL_PORT. Aucune authentification en développement.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        # Seule la route de santé est exposée pour l'instant (cf. consigne sécurité).
        include: health
  endpoint:
    health:
      # Pas de détails exposés publiquement tant que l'authentification n'existe pas.
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      # Obligatoire, aucune valeur par défaut : le démarrage échoue si
      # absent ou trop court (voir SecurityConfig.jwtSigningKey).
      secret: ${JWT_SECRET}
      issuer: esic-connect
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    invitation:
      # Durée de validité d'une invitation d'activation (RG-005 / RG-08 :
      # « un mois »). Configurable, doit rester strictement positive
      # (le démarrage échoue sinon, voir AccountInvitationService).
      token-ttl: ${INVITATION_TOKEN_TTL:P30D}
    password:
      # Longueur minimale (docs/02 §17.1). Le cahier impose une longueur
      # minimale et le blocage des mots de passe courants, sans exigence
      # de composition : celles-ci produisent des variantes prévisibles
      # sans gain réel. Ne peut pas descendre sous 12 (PasswordPolicy).
      min-length: ${PASSWORD_MIN_LENGTH:12}
    password-reset:
      # Durée de validité d'un lien de réinitialisation (EF-AUTH-005).
      # Volontairement courte : contrairement à une invitation, la
      # personne agit dans la foulée de sa demande.
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
      # Demandes de lien acceptées par adresse et par fenêtre.
      request-limit: ${PASSWORD_RESET_REQUEST_LIMIT:5}
      request-window: ${PASSWORD_RESET_REQUEST_WINDOW:PT1H}
      # Tentatives de consommation d'un même jeton par fenêtre.
      consume-limit: ${PASSWORD_RESET_CONSUME_LIMIT:10}
      consume-window: ${PASSWORD_RESET_CONSUME_WINDOW:PT1H}
    login:
      # Limitation de débit de la connexion (EF-AUTH-012, RG-092). Deux
      # seaux : par identité (borne les essais contre un compte) et par
      # origine réseau (borne un balayage de nombreux comptes avec un mot
      # de passe courant). Voir AuthenticationService.
      identity-limit: ${LOGIN_IDENTITY_LIMIT:10}
      origin-limit: ${LOGIN_ORIGIN_LIMIT:60}
      window: ${LOGIN_WINDOW:PT15M}
      # Nombre d'échecs au-delà duquel un contrôle anti-robot devient
      # obligatoire (RG-092, AC-022 : « après trois échecs, les contrôles
      # sont renforcés »). Compté par identité ET par origine réseau.
      captcha-after-failures: ${LOGIN_CAPTCHA_AFTER_FAILURES:3}
    mfa:
      # Rôles pour lesquels le second facteur est obligatoire (RG-007,
      # AC-021). Un rôle inconnu fait échouer le démarrage plutôt que
      # d'affaiblir silencieusement la politique.
      required-roles: ${MFA_REQUIRED_ROLES:SUPER_ADMIN,ADMIN}
      # Chiffrement AES-GCM du secret TOTP au repos. Sans valeur, la clé
      # est dérivée du secret JWT avec une séparation de domaine — le
      # produit démarre en local sans configuration supplémentaire, et un
      # avertissement est journalisé (voir SecretCipher).
      encryption-key: ${MFA_ENCRYPTION_KEY:}
      # Durée de vie d'un défi émis entre le mot de passe et le code.
      challenge-ttl: ${MFA_CHALLENGE_TTL:PT5M}
      # Tolérance de dérive d'horloge, exprimée en pas de 30 secondes.
      step-tolerance: ${MFA_STEP_TOLERANCE:1}
      # Nom affiché dans l'application d'authentification.
      issuer-label: ${MFA_ISSUER_LABEL:ESIC Connect}
      # Bornes anti-force brute sur la vérification d'un code à 6 chiffres.
      verify-limit: ${MFA_VERIFY_LIMIT:10}
      verify-window: ${MFA_VERIFY_WINDOW:PT15M}
    trusted-device:
      # Durée pendant laquelle un appareil reste reconnu (EF-AUTH-013).
      # La reconnaissance n'ouvre jamais de session à elle seule et ne
      # dispense jamais un compte privilégié de son second facteur.
      duration: ${TRUSTED_DEVICE_DURATION:P30D}
    webauthn:
      # Partie de confiance des clés d'accès (EF-AUTH-006, EF-AUTH-007).
      #
      # CONTRAINTE DU STANDARD : `rp-id` doit être le domaine de
      # l'application, et l'origine doit être servie en HTTPS — sauf
      # `localhost`, contexte sûr par exception. Un déploiement hors du
      # poste de développement exige donc un nom de domaine et HTTPS.
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: ${WEBAUTHN_RP_NAME:ESIC Connect}
      origins: ${WEBAUTHN_ORIGINS:http://localhost:4200}
      timeout: ${WEBAUTHN_TIMEOUT:PT2M}
    captcha:
      # Anti-robot Cloudflare Turnstile (EF-AUTH-011, docs/02 §17.9).
      #
      # La clé de SITE est publique par construction : elle s'affiche dans
      # le HTML du widget, et le front la lit via GET /api/v1/auth/captcha.
      # La clé SECRÈTE ne vit que dans l'environnement, jamais dans le
      # dépôt. Sans elle, l'adaptateur local prend le relais et le produit
      # DÉCLARE qu'aucun contrôle n'est actif — il n'en simule pas un.
      site-key: ${APP_SECURITY_CAPTCHA_SITE_KEY:}
      secret-key: ${APP_SECURITY_CAPTCHA_SECRET_KEY:}
      timeout: ${CAPTCHA_TIMEOUT:PT5S}
    cors:
      # Origines autorisées à appeler l'API depuis un navigateur
      # (docs/07 §8 : « CORS restrictif »). Liste explicite séparée par
      # des virgules ; jamais `*`. En local, `ng serve` proxifie `/api`
      # (aucune requête cross-origin) — cette valeur ne sert qu'à un
      # déploiement où le front est servi depuis un autre origin.
      # Les identifiants (cookies) ne sont pas utilisés : le jeton
      # circule dans l'en-tête `Authorization`, `allowCredentials=false`.
      allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:4200}
  attendance:
    # Durée de vie d'un jeton dynamique / code court d'émargement dans
    # Redis (docs/02 §17.10 : « le code visuel peut changer toutes les
    # 10 secondes »). Volontairement court ; l'écran formateur renouvelle
    # le jeton avant l'expiration. Doit rester strictement positive (le
    # démarrage échoue sinon, voir AttendanceTokenService).
    token-ttl: ${ATTENDANCE_TOKEN_TTL:PT30S}
    # Seuil de tolérance de retard : un émargement effectué au-delà de ce
    # délai après l'heure de début planifiée de la séance est classé
    # LATE (docs/02 §17.6, simplifié en un seuil unique dans cette
    # tranche). Doit rester >= 0 (le démarrage échoue sinon, voir
    # AttendanceService).
    late-threshold: ${ATTENDANCE_LATE_THRESHOLD:PT10M}
    # Pièces jointes des justificatifs (bloc G1-E ; DEC-G1-008). Le
    # CONTENU des fichiers est stocké HORS webroot, jamais en base. Le
    # répertoire doit être accessible en écriture ; par défaut un
    # sous-dossier de UPLOAD_DIRECTORY. Un déploiement avec système de
    # fichiers éphémère doit monter un volume persistant (ou substituer
    # un adaptateur objet — le métier ne dépend que du port).
    justification-storage-path: ${JUSTIFICATION_STORAGE_PATH:${UPLOAD_DIRECTORY:/data/uploads}/justifications}
    # Taille maximale d'une pièce jointe (octets ; CDC §43 RG-071 : 5 Mo).
    justification-max-file-bytes: ${JUSTIFICATION_MAX_FILE_BYTES:5242880}
    # Réconciliation TECHNIQUE des pièces jointes restées PENDING_STORAGE
    # (crash entre le commit métier et la bascule STORED — DEC-G1-009).
    # Seuil DISTINCT de toute politique de rétention métier (aucune n'est
    # définie, docs/07). Doit rester une durée strictement positive.
    justification-reconciliation-after: ${JUSTIFICATION_RECONCILIATION_AFTER:PT15M}
    # Taille du lot traité à chaque passage (borne). > 0.
    justification-reconciliation-batch: ${JUSTIFICATION_RECONCILIATION_BATCH:100}
    # Fréquence du passage de réconciliation (cron Spring, 6 champs).
    justification-reconciliation-cron: ${JUSTIFICATION_RECONCILIATION_CRON:0 */10 * * * *}
  activation:
    # Base du lien d'activation inséré dans l'email (front Angular à venir).
    base-url: ${APP_ACTIVATION_BASE_URL:http://localhost:4200/activation}
  password-reset:
    # Base du lien de réinitialisation inséré dans l'email.
    base-url: ${APP_PASSWORD_RESET_BASE_URL:http://localhost:4200/reinitialisation}
  mail:
    from: ${APP_MAIL_FROM:no-reply@esic-connect.test}
  import:
    student:
      # Import CSV contrôlé des apprenants (docs/02 §10 ; rapport
      # STUDENT_CSV_IMPORT_DESIGN.md §8, §3.2). Décisions de prototype :
      # limites conservatrices, rétention courte. Toute valeur invalide
      # (durée <= 0, largeur hors 1..9, max-rows < 100) fait échouer le
      # démarrage (StudentImportProperties).
      max-rows: ${STUDENT_IMPORT_MAX_ROWS:500}
      max-file-bytes: ${STUDENT_IMPORT_MAX_FILE_BYTES:2097152}
      simulation-ttl: ${STUDENT_IMPORT_SIMULATION_TTL:P7D}
      applied-rows-ttl: ${STUDENT_IMPORT_APPLIED_ROWS_TTL:P30D}
      number-sequence-width: ${STUDENT_IMPORT_NUMBER_SEQUENCE_WIDTH:5}
      number-alloc-max-retries: ${STUDENT_IMPORT_NUMBER_ALLOC_MAX_RETRIES:5}
  planning:
    # Import CSV, versionnement et publication d'un planning de classe
    # (docs/02 §13 ; G1_ARCHITECTURE_DECISIONS.md DEC-G1-005 ; bloc G1-B).
    # Bornes de durée d'un créneau et fenêtre horaire habituelle
    # configurables ; toute valeur invalide fait échouer le démarrage
    # (PlanningProperties).
    max-rows: ${PLANNING_MAX_ROWS:500}
    max-file-bytes: ${PLANNING_MAX_FILE_BYTES:2097152}
    simulation-ttl: ${PLANNING_SIMULATION_TTL:P7D}
    min-duration: ${PLANNING_MIN_DURATION:PT15M}
    max-duration: ${PLANNING_MAX_DURATION:PT8H}
    working-day-start: ${PLANNING_WORKING_DAY_START:08:00}
    working-day-end: ${PLANNING_WORKING_DAY_END:19:00}
