name: esic-connect

services:
  mysql:
    image: mysql:8.4
    container_name: esic-connect-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data-network

  redis:
    image: redis:7.4-alpine
    container_name: esic-connect-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: esic-connect-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - backend-network

  # Analyse antivirus des pièces jointes (EF-JUS-002 ; docs/02 §19.2).
  # Profil OPTIONNEL : `docker compose --profile antivirus up -d`.
  # Hors de ce profil, l'application marque chaque pièce NOT_SCANNED et
  # le déclare — elle ne simule pas un contrôle.
  # La première signature met plusieurs minutes à se télécharger : la
  # sonde attend donc longuement avant de déclarer le service sain.
  clamav:
    image: clamav/clamav:1.4
    container_name: esic-connect-clamav
    # L'image officielle ClamAV n'est publiée QUE pour linux/amd64 : sans
    # cette ligne, `docker compose up` échoue sur un poste Apple Silicon
    # avec « no matching manifest for linux/arm64 ». L'émulation est plus
    # lente qu'une exécution native — le chargement des signatures prend
    # plusieurs minutes — mais elle fonctionne, et c'est le seul moyen de
    # disposer d'un vrai clamd sur ces machines.
    platform: linux/amd64
    profiles:
      - antivirus
    restart: unless-stopped
    ports:
      - "${ANTIVIRUS_PORT:-3310}:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test:
        - CMD-SHELL
        - clamdscan --ping 1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - backend-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: esic-connect-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WEBSOCKET_PORT:-9001}:9001"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iot-network
      - backend-network

volumes:
  mysql-data:
  clamav-db:
  redis-data:
  mosquitto-data:
  mosquitto-log:

networks:
  backend-network:
  data-network:
  iot-network:
