name: frontend-ci

# CI du front-end Angular : lint, tests unitaires (Vitest + jsdom) et
# build de production. Aucun secret, aucun service externe.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: frontend lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24 + cache npm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Aligne le client npm sur la version déclarée dans
      # frontend/package.json (packageManager). Sans cela, le npm fourni
      # avec Node 24 régénère un arbre différent et `npm ci` échoue sur
      # des entrées de lockfile absentes.
      - name: Align npm with package.json packageManager
        run: |
          npm install --global npm@11.6.2
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # Chaîne d'approvisionnement (FINAL-006) : échoue si une dépendance
      # npm (dev ou prod) porte une vulnérabilité connue de sévérité
      # >= high. Complète la dependency-review différentielle des PR.
      - name: Audit des dépendances npm
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build
