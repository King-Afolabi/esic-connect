name: deploy

# Déploiement continu vers la Raspberry Pi de recette, sur le runner
# auto-hébergé qui y tourne (`pi-esic-connect`, systemd, démarre au
# boot). Se déclenche à chaque push sur `main` (donc après chaque merge
# de PR), et reste disponible en manuel pour rejouer un déploiement.
#
# Le dépôt déployé (~/esic-connect) N'EST PAS un dépôt git — .env,
# backups/ et les volumes Docker y vivent en dehors de l'espace de
# travail du runner. Ce workflow synchronise seulement le code source
# (rsync --delete, sans toucher .env ni backups/) puis reconstruit
# uniquement les services dont le code a changé.
#
# Sécurité : le runner tourne sur la machine cible elle-même (pas
# d'accès réseau entrant nécessaire), avec les mêmes droits Docker que
# l'utilisateur `king_a` qui exploite déjà la pile en production.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruire/redéployer backend + frontend même si le dernier commit ne les touche pas (rejouer un déploiement)"
        type: boolean
        default: false
      reset_demo_db:
        description: "DANGER — purge complète de la base applicative (DROP + CREATE) avant le redéploiement. Une sauvegarde est prise juste avant. Réservé à une base de démonstration dont la perte est acceptée (ex. incompatibilité de schéma après réécriture d'une migration Flyway déjà appliquée)."
        type: boolean
        default: false

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  deploy:
    name: déploiement Raspberry Pi
    runs-on: [self-hosted, pi]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Détecter les services impactés
        id: changed
        run: |
          BACKEND=false
          FRONTEND=false
          if [ "${{ inputs.force }}" = "true" ]; then
            BACKEND=true
            FRONTEND=true
          else
            if git diff --name-only HEAD^ HEAD | grep -qE '^backend/'; then BACKEND=true; fi
            if git diff --name-only HEAD^ HEAD | grep -qE '^frontend/'; then FRONTEND=true; fi
          fi
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Backend modifié : $BACKEND / Frontend modifié : $FRONTEND"

      - name: Sauvegarde préalable (MySQL + justificatifs + images actives)
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.frontend == 'true'
        working-directory: /home/king_a/esic-connect
        run: |
          set -e
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p backups/$STAMP
          set -a && source .env && set +a
          docker compose -f compose.prod.yaml exec -T mysql sh -c \
            'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
            | gzip > backups/$STAMP/mysql-dump.sql.gz
          gzip -t backups/$STAMP/mysql-dump.sql.gz
          if [ "${{ steps.changed.outputs.backend }}" = "true" ]; then
            docker inspect esic-connect-backend --format '{{.Image}}' > backups/$STAMP/backend-image-before.txt
            docker tag "$(cat backups/$STAMP/backend-image-before.txt)" "esic-connect-backend:rollback-$STAMP"
          fi
          if [ "${{ steps.changed.outputs.frontend }}" = "true" ]; then
            docker inspect esic-connect-frontend --format '{{.Image}}' > backups/$STAMP/frontend-image-before.txt
            docker tag "$(cat backups/$STAMP/frontend-image-before.txt)" "esic-connect-frontend:rollback-$STAMP"
          fi
          echo "Sauvegarde: backups/$STAMP"

      - name: Réinitialisation de la base de démonstration (opt-in explicite)
        # Exige aussi backend == 'true' (donc `force`) : sans ça, l'étape
        # suivante ne relancerait jamais le backend qu'on vient d'arrêter.
        if: github.event_name == 'workflow_dispatch' && inputs.reset_demo_db == 'true' && steps.changed.outputs.backend == 'true'
        working-directory: /home/king_a/esic-connect
        run: |
          set -e
          echo "::warning::Réinitialisation demandée (reset_demo_db) : arrêt du backend puis purge complète de la base applicative. Sauvegarde déjà prise à l'étape précédente (backups/$STAMP)."
          docker compose -f compose.prod.yaml stop backend
          docker compose -f compose.prod.yaml exec -T mysql sh -c \
            'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "DROP DATABASE IF EXISTS $MYSQL_DATABASE; CREATE DATABASE $MYSQL_DATABASE CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"'
          echo "Base réinitialisée (vide) — Flyway la repeuplera entièrement (toutes les migrations, schéma courant) au prochain démarrage du backend ; DemoDataInitializer réamorcera les comptes de démonstration, SuperAdmin inclus."

      - name: Synchroniser le code source (sans toucher .env / backups)
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.frontend == 'true'
        run: |
          set -e
          rsync -a --delete \
            --exclude '.env' --exclude 'backups/' --exclude 'frontend-*' \
            "$GITHUB_WORKSPACE"/ /home/king_a/esic-connect/

      - name: Rebuild + redéploiement backend
        if: steps.changed.outputs.backend == 'true'
        working-directory: /home/king_a/esic-connect
        run: |
          set -e
          docker compose -f compose.prod.yaml build backend
          docker compose -f compose.prod.yaml up -d --no-deps backend

      - name: Rebuild + redéploiement frontend
        if: steps.changed.outputs.frontend == 'true'
        working-directory: /home/king_a/esic-connect
        run: |
          set -e
          docker compose -f compose.prod.yaml build frontend
          docker compose -f compose.prod.yaml up -d --no-deps frontend

      - name: Attendre l'état "healthy"
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.frontend == 'true'
        working-directory: /home/king_a/esic-connect
        run: |
          set -e
          SERVICES=""
          [ "${{ steps.changed.outputs.backend }}" = "true" ] && SERVICES="$SERVICES esic-connect-backend"
          [ "${{ steps.changed.outputs.frontend }}" = "true" ] && SERVICES="$SERVICES esic-connect-frontend"
          for i in $(seq 1 30); do
            OK=true
            for s in $SERVICES; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$s" 2>/dev/null || echo "unknown")
              [ "$STATUS" != "healthy" ] && OK=false
            done
            $OK && { echo "Tous les services impactés sont healthy."; exit 0; }
            sleep 4
          done
          echo "::error::Au moins un service n'est pas devenu healthy à temps."
          exit 1

      - name: Vérification publique (tunnel)
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.frontend == 'true'
        run: |
          set -e
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://app.esic-connect.courses/ || echo 000)
            [ "$CODE" = "200" ] && { echo "Site public OK (200)."; exit 0; }
            sleep 4
          done
          echo "::error::Le site public ne répond pas 200 après déploiement."
          exit 1

      - name: Journaux de diagnostic (si dégradé)
        if: failure() && (steps.changed.outputs.backend == 'true' || steps.changed.outputs.frontend == 'true')
        working-directory: /home/king_a/esic-connect
        run: |
          echo "--- docker compose ps ---"
          docker compose -f compose.prod.yaml ps || true
          echo "--- backend (200 dernières lignes) ---"
          docker compose -f compose.prod.yaml logs --tail=200 backend || true
          echo "--- frontend (100 dernières lignes) ---"
          docker compose -f compose.prod.yaml logs --tail=100 frontend || true

      - name: Rollback automatique si dégradé
        if: failure() && (steps.changed.outputs.backend == 'true' || steps.changed.outputs.frontend == 'true')
        working-directory: /home/king_a/esic-connect
        run: |
          set +e
          echo "::warning::Échec détecté, rollback vers les images précédentes."
          if [ "${{ steps.changed.outputs.backend }}" = "true" ] && [ -f "backups/$STAMP/backend-image-before.txt" ]; then
            docker tag "esic-connect-backend:rollback-$STAMP" esic-connect-backend:latest
            docker compose -f compose.prod.yaml up -d --no-deps backend
          fi
          if [ "${{ steps.changed.outputs.frontend }}" = "true" ] && [ -f "backups/$STAMP/frontend-image-before.txt" ]; then
            docker tag "esic-connect-frontend:rollback-$STAMP" esic-connect-frontend:latest
            docker compose -f compose.prod.yaml up -d --no-deps frontend
          fi
          echo "::error::Déploiement annulé, rollback appliqué. Base de données NON restaurée automatiquement (dump disponible: backups/$STAMP/mysql-dump.sql.gz) — vérifier manuellement si une migration Flyway a tourné."
