name: e2e

# Recette end-to-end NAVIGATEUR (Playwright / Chromium) contre la pile
# complète réellement démarrée : MySQL + Redis éphémères, back-end Spring
# Boot en profil `demo`, front-end Angular servi par `ng serve`.
#
# DÉCLENCHEMENT MANUEL UNIQUEMENT (`workflow_dispatch`). Motif assumé :
#   - la suite dure 18 à 20 minutes dans un environnement sain et mute un
#     état partagé (elle tourne avec `workers: 1`) ;
#   - elle exige une pile complète, contrairement à `backend-ci` et
#     `frontend-ci` qui restent les garde-fous de chaque PR ;
#   - la décision `DEC-G1-011` (ne pas construire de suite e2e) a été
#     révisée le 3 septembre 2026, mais la suite reste un complément à la
#     recette d'intégration API, pas son remplacement.
# Voir docs/08-tests-recette.md §2bis.5 et audit-report.md §4.
#
# Identifiants : uniquement dédiés à cette CI, comptes strictement
# fictifs (`example.test`), jamais réutilisés ailleurs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: recette e2e navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: esic_connect_demo
          MYSQL_USER: esic_ci_user
          MYSQL_PASSWORD: esic_ci_mysql_pw
          MYSQL_ROOT_PASSWORD: esic_ci_root_pw
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

      redis:
        image: redis:7.4-alpine
        command: redis-server --requirepass esic_ci_redis_pw
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli -a esic_ci_redis_pw ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: esic_connect_demo
      MYSQL_USER: esic_ci_user
      MYSQL_PASSWORD: esic_ci_mysql_pw
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: esic_ci_redis_pw
      JWT_SECRET: ci-only-jwt-secret-value-at-least-32-bytes-long
      # Comptes de démonstration strictement fictifs, base jetée à la fin
      # du run. Lu par le back-end (profil `demo`) ET par la suite e2e
      # (tests/support/accounts.ts) : les deux doivent voir la même valeur.
      ESIC_DEMO_PASSWORD: ci-only-demo-password
      SPRING_PROFILES_ACTIVE: demo
      APP_ALLOWED_ORIGINS: http://localhost:4200

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin) + cache Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Répertoire de stockage des pièces jointes
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/e2e-data/justifications"
          echo "JUSTIFICATION_STORAGE_PATH=${GITHUB_WORKSPACE}/build/e2e-data/justifications" >> "$GITHUB_ENV"

      - name: Démarrer le back-end (profil demo)
        working-directory: backend
        run: |
          chmod +x ./mvnw
          nohup ./mvnw --batch-mode spring-boot:run > "${GITHUB_WORKSPACE}/backend.log" 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/backend.pid"

      - name: Installer les dépendances front-end
        working-directory: frontend
        run: |
          npm install --global npm@11.6.2
          npm ci

      - name: Démarrer le front-end (ng serve, proxy /api)
        working-directory: frontend
        run: |
          nohup npm start > "${GITHUB_WORKSPACE}/frontend.log" 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/frontend.pid"

      - name: Attendre que la pile réponde
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "back-end prêt (tentative $i)"; break
            fi
            [ "$i" -eq 90 ] && { echo "::error::back-end indisponible"; tail -100 backend.log; exit 1; }
            sleep 5
          done
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4200 > /dev/null 2>&1; then
              echo "front-end prêt (tentative $i)"; break
            fi
            [ "$i" -eq 60 ] && { echo "::error::front-end indisponible"; tail -100 frontend.log; exit 1; }
            sleep 5
          done

      - name: Installer Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Exécuter la suite e2e
        run: npm run test:e2e

      - name: Publier le rapport et les journaux
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/
            backend.log
            frontend.log
          retention-days: 30
